<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gait Asimetri - Keseluruhan Parameter</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1f4e78; text-align: center; margin-top: 0; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .param-card { background: #fafafa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; }
        .param-card h4 { margin: 0 0 10px 0; color: #1f4e78; border-bottom: 2px solid #1f4e78; padding-bottom: 5px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group div { flex: 1; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #444; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        button { width: 100%; padding: 14px; background-color: #1f4e78; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #143350; }
        
        .results-section { margin-top: 30px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background-color: #1f4e78; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; display: inline-block; }
        .sangat-simetris { background-color: #d4edda; color: #155724; }
        .asimetri-rendah { background-color: #fff3cd; color: #856404; }
        .asimetri-sedang { background-color: #ffe8d6; color: #a75d00; }
        .asimetri-tinggi { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Gait Asimetri - Keseluruhan Parameter</h2>
    <p class="subtitle">Masukkan data Left (Kiri) dan Right (Kanan) untuk menghitung Robinson Symmetry Index (SI) secara otomatis.</p>
    
    <div class="grid-container" id="inputsContainer"></div>

    <button onclick="hitungSemua()">Hitung Keseluruhan SI (%) & Kategori</button>

    <div class="results-section" id="resultsSection">
        <h3>Hasil Analisis Keseluruhan</h3>
        <table>
            <thead>
                <tr>
                    <th>Parameter</th>
                    <th>Left (Kiri)</th>
                    <th>Right (Kanan)</th>
                    <th>SI (%)</th>
                    <th>Kategori Asimetri</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const parameters = [
        { id: "kecepatan", name: "Kecepatan (m/s)" },
        { id: "panjang_tungkai", name: "Panjang Tungkai (cm)" },
        { id: "vgrf_total", name: "vGRF Total" },
        { id: "ankle_contact", name: "Ankle Contact Force" },
        { id: "vgrf_ic", name: "vGRF IC" },
        { id: "vgrf_ms", name: "vGRF MS" },
        { id: "vgrf_ts", name: "vGRF TS" },
        { id: "vgrf_to", name: "vGRF TO" },
        { id: "lean_mass", name: "Segmental Lean Mass Foot (kg)" },
        { id: "hip_angle", name: "Hip Joint Angle (°)" },
        { id: "knee_angle", name: "Knee Joint Angle (°)" },
        { id: "ankle_angle", name: "Ankle Joint Angle (°)" }
    ];

    // Buat input form otomatis
    const container = document.getElementById('inputsContainer');
    parameters.forEach(p => {
        const card = document.createElement('div');
        card.className = 'param-card';
        card.innerHTML = `
            <h4>${p.name}</h4>
            <div class="input-group">
                <div>
                    <label>Left (Kiri):</label>
                    <input type="number" step="any" id="${p.id}_left" placeholder="0.00">
                </div>
                <div>
                    <label>Right (Kanan):</label>
                    <input type="number" step="any" id="${p.id}_right" placeholder="0.00">
                </div>
            </div>
        `;
        container.appendChild(card);
    });

    function hitungSemua() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        parameters.forEach(p => {
            const leftVal = parseFloat(document.getElementById(`${p.id}_left`).value) || 0;
            const rightVal = parseFloat(document.getElementById(`${p.id}_right`).value) || 0;

            let si = 0;
            let kategori = "Data Kosong";
            let badgeClass = "";

            if (leftVal + rightVal !== 0) {
                // Rumus Robinson Symmetry Index (SI)
                si = Math.abs(2 * (leftVal - rightVal) / (leftVal + rightVal)) * 100;

                if (si < 2) {
                    kategori = "Sangat Simetris (<2%)";
                    badgeClass = "sangat-simetris";
                } else if (si <= 5) {
                    kategori = "Asimetri Rendah (2-5%)";
                    badgeClass = "asimetri-rendah";
                } else if (si <= 7) {
                    kategori = "Asimetri Sedang (5-7%)";
                    badgeClass = "asimetri-sedang";
                } else {
                    kategori = "Asimetri Tinggi (>7%)";
                    badgeClass = "asimetri-tinggi";
                }
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="text-align: left; font-weight: bold;">${p.name}</td>
                <td>${leftVal.toFixed(2)}</td>
                <td>${rightVal.toFixed(2)}</td>
                <td><strong>${si.toFixed(2)}%</strong></td>
                <td><span class="badge ${badgeClass}">${kategori}</span></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('resultsSection').style.display = 'block';
    }
</script>

</body>
</html>
